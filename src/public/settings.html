<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Meeting Follow-up System</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f7fa;
      color: #333;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: linear-gradient(135deg, #4A8B8B 0%, #3d7575 100%);
      color: white;
      padding: 20px 0;
      margin-bottom: 30px;
    }

    header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 24px;
      font-weight: 600;
    }

    header a {
      background: rgba(255,255,255,0.2);
      padding: 8px 16px;
      border-radius: 20px;
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    header a:hover {
      background: rgba(255,255,255,0.3);
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      background: white;
      padding: 4px;
      border-radius: 10px;
      width: fit-content;
    }

    .tab {
      padding: 10px 20px;
      border: none;
      background: none;
      cursor: pointer;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #666;
      transition: all 0.2s;
    }

    .tab:hover {
      background: #f0f0f0;
    }

    .tab.active {
      background: #4A8B8B;
      color: white;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #444;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .user-list {
      display: grid;
      gap: 16px;
    }

    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border: 1px solid #eee;
      border-radius: 10px;
    }

    .user-info h3 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .user-info p {
      color: #666;
      font-size: 14px;
    }

    .user-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .status-dot.connected {
      background: #28a745;
    }

    .status-dot.disconnected {
      background: #dc3545;
    }

    .user-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4A8B8B 0%, #3d7575 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(74, 139, 139, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background: #c82333;
    }

    .btn-success {
      background: #28a745;
      color: white;
    }

    .btn-success:hover {
      background: #218838;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #555;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: #4A8B8B;
    }

    .form-group textarea {
      min-height: 200px;
      font-family: monospace;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 24px;
      max-width: 500px;
      width: 90%;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-size: 18px;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #666;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 20px;
    }

    .template-editor {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .template-editor {
        grid-template-columns: 1fr;
      }
    }

    .template-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .template-tab {
      padding: 8px 16px;
      border: 1px solid #ddd;
      border-radius: 20px;
      background: white;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .template-tab:hover {
      border-color: #4A8B8B;
    }

    .template-tab.active {
      background: #4A8B8B;
      color: white;
      border-color: #4A8B8B;
    }

    .preview-frame {
      border: 1px solid #ddd;
      border-radius: 8px;
      height: 400px;
      overflow: auto;
      background: white;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 16px 24px;
      border-radius: 8px;
      color: white;
      font-weight: 500;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.success {
      background: #28a745;
    }

    .toast.error {
      background: #dc3545;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #888;
    }

    .help-text {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
    }

    .variable-hint {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .variable-hint code {
      background: #e9ecef;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div style="display: flex; align-items: center; gap: 12px;">
        <img src="/logo.png" alt="Bright Automations" style="width: 40px; height: 40px; border-radius: 8px;">
        <h1>Settings</h1>
      </div>
      <a href="/">Back to Dashboard</a>
    </div>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab active" data-section="users">Team Members</button>
      <button class="tab" data-section="templates">Email Templates</button>
    </div>

    <!-- Team Members Section -->
    <div id="users-section" class="section active">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2>Team Members</h2>
          <button class="btn btn-primary" onclick="showAddUserModal()">Add Team Member</button>
        </div>

        <div class="user-list" id="user-list">
          <div class="empty-state">Loading...</div>
        </div>
      </div>
    </div>

    <!-- Email Templates Section -->
    <div id="templates-section" class="section">
      <div class="card">
        <h2>Email Templates</h2>

        <div class="form-group">
          <label>Select Team Member</label>
          <select id="template-user-select" onchange="loadTemplatesForUser()">
            <option value="">-- Select Team Member --</option>
          </select>
        </div>

        <div id="template-editor-container" style="display: none;">
          <div class="template-selector" id="template-tabs"></div>

          <div class="variable-hint">
            <strong>Available Variables:</strong>
            <code>{{clientName}}</code>
            <code>{{meetingTitle}}</code>
            <code>{{meetingDate}}</code>
            <code>{{confirmUrl}}</code>
            <code>{{senderName}}</code>
          </div>

          <div class="template-editor">
            <div>
              <div class="form-group">
                <label>Subject</label>
                <input type="text" id="template-subject">
              </div>
              <div class="form-group">
                <label>HTML Body</label>
                <textarea id="template-html"></textarea>
              </div>
              <div class="form-group">
                <label>Plain Text Body</label>
                <textarea id="template-text" style="min-height: 100px;"></textarea>
              </div>
              <div style="display: flex; gap: 12px;">
                <button class="btn btn-primary" onclick="saveTemplate()">Save Template</button>
                <button class="btn btn-secondary" onclick="resetTemplate()">Reset to Default</button>
              </div>
            </div>
            <div>
              <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #555;">Preview</label>
              <div class="preview-frame">
                <iframe id="preview-iframe" style="width: 100%; height: 100%; border: none;"></iframe>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add User Modal -->
  <div class="modal" id="add-user-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Add Team Member</h3>
        <button class="modal-close" onclick="hideAddUserModal()">&times;</button>
      </div>
      <form id="add-user-form" onsubmit="createUser(event)">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="new-user-name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="new-user-email" placeholder="john@example.com" required>
          <p class="help-text">This should be a Gmail address that will be used to send emails.</p>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="hideAddUserModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Member</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script>
    const API_BASE = '/api';
    let allUsers = [];
    let currentTemplates = [];
    let currentTemplateType = 'confirmation_request';
    let currentTemplateId = null;

    const TEMPLATE_LABELS = {
      'confirmation_request': 'Confirmation Request',
      'final_reminder': '1-Hour Reminder',
      'acknowledgement': 'Confirmation Acknowledgement',
      'cancellation': 'Cancellation Notice'
    };

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      setupTabs();
      loadUsers();
      checkUrlParams();
    });

    function checkUrlParams() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('gmail') === 'connected') {
        const userName = params.get('user');
        showToast(`Gmail connected for ${userName}!`, 'success');
        window.history.replaceState({}, document.title, '/settings.html');
      } else if (params.get('gmail') === 'error') {
        showToast('Failed to connect Gmail. Please try again.', 'error');
        window.history.replaceState({}, document.title, '/settings.html');
      }
    }

    function setupTabs() {
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById(`${tab.dataset.section}-section`).classList.add('active');
        });
      });
    }

    async function loadUsers() {
      try {
        const response = await fetch(`${API_BASE}/users`);
        const data = await response.json();
        allUsers = data.users || [];
        renderUserList();
        populateTemplateUserSelect();
      } catch (error) {
        console.error('Failed to load users:', error);
        showToast('Failed to load users', 'error');
      }
    }

    function renderUserList() {
      const container = document.getElementById('user-list');

      if (allUsers.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>No team members yet. Add your first team member to get started.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = allUsers.map(user => `
        <div class="user-item">
          <div class="user-info">
            <h3>${escapeHtml(user.name)}</h3>
            <p>${escapeHtml(user.email)}</p>
          </div>
          <div class="user-status">
            <span class="status-dot ${user.hasGmailConnected ? 'connected' : 'disconnected'}"></span>
            <span>${user.hasGmailConnected ? 'Gmail Connected' : 'Gmail Not Connected'}</span>
          </div>
          <div class="user-actions">
            ${user.hasGmailConnected
              ? `<button class="btn btn-secondary" onclick="disconnectGmail('${user.id}')">Disconnect Gmail</button>`
              : `<button class="btn btn-success" onclick="connectGmail('${user.id}')">Connect Gmail</button>`
            }
            <button class="btn btn-danger" onclick="deleteUser('${user.id}', '${escapeHtml(user.name)}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function populateTemplateUserSelect() {
      const select = document.getElementById('template-user-select');
      select.innerHTML = '<option value="">-- Select Team Member --</option>';

      allUsers.forEach(user => {
        const option = document.createElement('option');
        option.value = user.id;
        option.textContent = user.name;
        select.appendChild(option);
      });
    }

    function showAddUserModal() {
      document.getElementById('add-user-modal').classList.add('show');
      document.getElementById('new-user-name').focus();
    }

    function hideAddUserModal() {
      document.getElementById('add-user-modal').classList.remove('show');
      document.getElementById('add-user-form').reset();
    }

    async function createUser(e) {
      e.preventDefault();

      const name = document.getElementById('new-user-name').value;
      const email = document.getElementById('new-user-email').value;

      try {
        const response = await fetch(`${API_BASE}/users`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to create user');
        }

        showToast(`Added ${name} to the team!`, 'success');
        hideAddUserModal();
        await loadUsers();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    async function connectGmail(userId) {
      try {
        const response = await fetch(`${API_BASE}/users/${userId}/auth-url`);
        const data = await response.json();
        window.location.href = data.authUrl;
      } catch (error) {
        showToast('Failed to start Gmail connection', 'error');
      }
    }

    async function disconnectGmail(userId) {
      if (!confirm('Are you sure you want to disconnect Gmail for this user?')) return;

      try {
        const response = await fetch(`${API_BASE}/users/${userId}/disconnect-gmail`, {
          method: 'POST'
        });

        if (!response.ok) throw new Error('Failed to disconnect');

        showToast('Gmail disconnected', 'success');
        await loadUsers();
      } catch (error) {
        showToast('Failed to disconnect Gmail', 'error');
      }
    }

    async function deleteUser(userId, userName) {
      if (!confirm(`Are you sure you want to delete ${userName}? This will also delete their templates.`)) return;

      try {
        const response = await fetch(`${API_BASE}/users/${userId}`, {
          method: 'DELETE'
        });

        if (!response.ok) throw new Error('Failed to delete');

        showToast(`Deleted ${userName}`, 'success');
        await loadUsers();
      } catch (error) {
        showToast('Failed to delete user', 'error');
      }
    }

    // Template functions
    async function loadTemplatesForUser() {
      const userId = document.getElementById('template-user-select').value;
      const container = document.getElementById('template-editor-container');

      if (!userId) {
        container.style.display = 'none';
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/templates?userId=${userId}`);
        const data = await response.json();
        currentTemplates = data.templates || [];

        container.style.display = 'block';
        renderTemplateTabs();
        selectTemplate('confirmation_request');
      } catch (error) {
        showToast('Failed to load templates', 'error');
      }
    }

    function renderTemplateTabs() {
      const container = document.getElementById('template-tabs');
      container.innerHTML = Object.entries(TEMPLATE_LABELS).map(([type, label]) => `
        <button class="template-tab ${type === currentTemplateType ? 'active' : ''}"
                onclick="selectTemplate('${type}')">${label}</button>
      `).join('');
    }

    function selectTemplate(type) {
      currentTemplateType = type;
      renderTemplateTabs();

      const template = currentTemplates.find(t => t.templateType === type);
      if (template) {
        currentTemplateId = template.id;
        document.getElementById('template-subject').value = template.subject;
        document.getElementById('template-html').value = template.htmlBody;
        document.getElementById('template-text').value = template.textBody;
        updatePreview();
      } else {
        // Load default template
        loadDefaultTemplate(type);
      }
    }

    async function loadDefaultTemplate(type) {
      const userId = document.getElementById('template-user-select').value;
      const user = allUsers.find(u => u.id === userId);

      try {
        const response = await fetch(`${API_BASE}/templates/default/${type}?senderName=${encodeURIComponent(user?.name || 'The Team')}`);
        const data = await response.json();

        currentTemplateId = null;
        document.getElementById('template-subject').value = data.template.subject;
        document.getElementById('template-html').value = data.template.htmlBody;
        document.getElementById('template-text').value = data.template.textBody;
        updatePreview();
      } catch (error) {
        console.error('Failed to load default template:', error);
      }
    }

    function updatePreview() {
      const html = document.getElementById('template-html').value;
      const iframe = document.getElementById('preview-iframe');

      // Replace template variables with sample data
      const sampleHtml = html
        .replace(/\{\{clientName\}\}/g, 'John Smith')
        .replace(/\{\{meetingTitle\}\}/g, 'Project Discussion')
        .replace(/\{\{meetingDate\}\}/g, 'Friday, January 24th at 2:00 PM')
        .replace(/\{\{confirmUrl\}\}/g, '#')
        .replace(/\{\{senderName\}\}/g, 'Jane Doe');

      iframe.srcdoc = sampleHtml;
    }

    // Add input listeners for live preview
    document.getElementById('template-html')?.addEventListener('input', updatePreview);

    async function saveTemplate() {
      const userId = document.getElementById('template-user-select').value;
      if (!userId) {
        showToast('Please select a team member first', 'error');
        return;
      }

      const subject = document.getElementById('template-subject').value;
      const htmlBody = document.getElementById('template-html').value;
      const textBody = document.getElementById('template-text').value;

      try {
        if (currentTemplateId) {
          // Update existing
          const response = await fetch(`${API_BASE}/templates/${currentTemplateId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ subject, htmlBody, textBody })
          });

          if (!response.ok) throw new Error('Failed to save');
        } else {
          // Reset creates the template
          const response = await fetch(`${API_BASE}/templates/reset/${userId}/${currentTemplateType}`, {
            method: 'POST'
          });

          if (!response.ok) throw new Error('Failed to save');

          // Then update it
          const data = await response.json();
          await fetch(`${API_BASE}/templates/${data.template.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ subject, htmlBody, textBody })
          });
        }

        showToast('Template saved!', 'success');
        await loadTemplatesForUser();
      } catch (error) {
        showToast('Failed to save template', 'error');
      }
    }

    async function resetTemplate() {
      const userId = document.getElementById('template-user-select').value;
      if (!userId) return;

      if (!confirm('Reset this template to the default? Your changes will be lost.')) return;

      try {
        const response = await fetch(`${API_BASE}/templates/reset/${userId}/${currentTemplateType}`, {
          method: 'POST'
        });

        if (!response.ok) throw new Error('Failed to reset');

        showToast('Template reset to default', 'success');
        await loadTemplatesForUser();
      } catch (error) {
        showToast('Failed to reset template', 'error');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
  </script>
</body>
</html>
