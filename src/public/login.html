<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Bright Automations</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #4A8B8B 0%, #3d7575 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
    }

    .logo-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-section img {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    .logo-section h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 4px;
    }

    .logo-section p {
      color: #6b7280;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      color: #1a1a2e;
      transition: all 0.2s;
      background: #f9fafb;
    }

    .form-input:focus {
      outline: none;
      border-color: #4A8B8B;
      background: white;
      box-shadow: 0 0 0 4px rgba(74, 139, 139, 0.1);
    }

    .form-input::placeholder {
      color: #9ca3af;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4A8B8B 0%, #3d7575 100%);
      color: white;
      margin-bottom: 16px;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(74, 139, 139, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-google {
      background: white;
      border: 1px solid #e5e7eb;
      color: #374151;
    }

    .btn-google:hover {
      background: #f9fafb;
      border-color: #d1d5db;
    }

    .btn-google svg {
      width: 20px;
      height: 20px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .divider span {
      color: #9ca3af;
      font-size: 13px;
    }

    .footer-text {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #6b7280;
    }

    .footer-text a {
      color: #4A8B8B;
      text-decoration: none;
      font-weight: 500;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }

    .error-message {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #16a34a;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    .forgot-password {
      text-align: right;
      margin-top: -12px;
      margin-bottom: 20px;
    }

    .forgot-password a {
      color: #4A8B8B;
      font-size: 13px;
      text-decoration: none;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    .integrations-preview {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #e5e7eb;
    }

    .integrations-preview h3 {
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      text-align: center;
    }

    .integration-badges {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .integration-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 12px;
      color: #6b7280;
    }

    .integration-badge svg {
      width: 16px;
      height: 16px;
    }

    .integration-badge.coming-soon {
      opacity: 0.6;
    }

    .coming-soon-tag {
      font-size: 9px;
      background: #e5e7eb;
      padding: 2px 6px;
      border-radius: 4px;
      color: #6b7280;
    }

    .loading {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo-section">
        <img src="/logo.png" alt="Bright Automations">
        <h1>Welcome back</h1>
        <p>Sign in to your meeting follow-up dashboard</p>
      </div>

      <div class="error-message" id="error-message"></div>
      <div class="success-message" id="success-message"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="email" placeholder="you@company.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="password" placeholder="Enter your password" required>
        </div>

        <div class="forgot-password">
          <a href="/forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" id="login-btn">
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <div class="divider">
        <span>or continue with</span>
      </div>

      <button type="button" class="btn btn-google" id="google-btn">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <p class="footer-text">
        Don't have an account? <a href="/signup.html">Create one</a>
      </p>

      <div class="integrations-preview">
        <h3>Integrations Available</h3>
        <div class="integration-badges">
          <div class="integration-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="#EA4335" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            Gmail
          </div>
          <div class="integration-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="#4285F4" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            Google Calendar
          </div>
          <div class="integration-badge coming-soon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#FF7A59" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 6v6l4 2"/>
            </svg>
            HubSpot
            <span class="coming-soon-tag">Soon</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Supabase client will be initialized with env vars from server
    let supabase = null;

    async function initSupabase() {
      try {
        const response = await fetch('/api/auth/config');
        const config = await response.json();
        if (config.supabaseUrl && config.supabaseAnonKey) {
          supabase = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

          // Check if already logged in
          const { data: { session } } = await supabase.auth.getSession();
          if (session) {
            window.location.href = '/';
          }
        } else {
          // Auth not configured, show demo mode
          showError('Auth not configured. Running in demo mode.');
        }
      } catch (error) {
        console.error('Failed to init Supabase:', error);
      }
    }

    initSupabase();

    function showError(message) {
      const el = document.getElementById('error-message');
      el.textContent = message;
      el.classList.add('show');
      document.getElementById('success-message').classList.remove('show');
    }

    function showSuccess(message) {
      const el = document.getElementById('success-message');
      el.textContent = message;
      el.classList.add('show');
      document.getElementById('error-message').classList.remove('show');
    }

    function hideMessages() {
      document.getElementById('error-message').classList.remove('show');
      document.getElementById('success-message').classList.remove('show');
    }

    // Email/Password login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      if (!supabase) {
        showError('Authentication is not configured');
        return;
      }

      const btn = document.getElementById('login-btn');
      const btnText = btn.querySelector('.btn-text');
      btn.disabled = true;
      btnText.innerHTML = '<span class="loading"></span>';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        // Check if user has an organization
        const response = await fetch('/api/auth/check-org', {
          headers: {
            'Authorization': `Bearer ${data.session.access_token}`
          }
        });
        const orgData = await response.json();

        if (orgData.hasOrganization) {
          window.location.href = '/';
        } else {
          window.location.href = '/onboarding.html';
        }
      } catch (error) {
        showError(error.message || 'Failed to sign in');
        btn.disabled = false;
        btnText.textContent = 'Sign In';
      }
    });

    // Google OAuth login
    document.getElementById('google-btn').addEventListener('click', async () => {
      if (!supabase) {
        showError('Authentication is not configured');
        return;
      }

      try {
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin + '/api/auth/callback'
          }
        });
        if (error) throw error;
      } catch (error) {
        showError(error.message || 'Failed to sign in with Google');
      }
    });

    // Check URL params for messages
    const params = new URLSearchParams(window.location.search);
    if (params.get('registered') === 'true') {
      showSuccess('Account created! Please check your email to verify your account.');
    }
    if (params.get('reset') === 'true') {
      showSuccess('Password reset email sent. Check your inbox.');
    }
    if (params.get('error')) {
      showError(params.get('error'));
    }
  </script>
</body>
</html>
